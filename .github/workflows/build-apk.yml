name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_OUTPUT="$(java -version 2>&1 | head -n 1)"
          if [ -z "$JAVA_VER_OUTPUT" ]; then
            echo "Error: Java cannot be detected."
            exit 1
          fi
          JAVA_MAJOR="$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*"([0-9]+)(\.[0-9]+)*".*/\1/')"
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Unable to parse Java major version from: $JAVA_VER_OUTPUT"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK at $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File does not have .apk extension."
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path mismatch."
            exit 1
          fi
          echo "Verified APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          RELEASE_TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          RELEASE_APK_PATH="${RELEASE_TMP_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_APK_PATH"
          if [ ! -f "$RELEASE_APK_PATH" ] || [ ! -s "$RELEASE_APK_PATH" ]; then
            echo "Error: Failed to prepare release APK asset."
            exit 1
          fi
          echo "apk_path=${RELEASE_APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          PREPARED_APK="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "Error: Prepared APK does not exist or is empty."
            exit 1
          fi
          case "$PREPARED_APK" in
            *.apk) ;;
            *)
              echo "Error: Prepared APK does not end in .apk."
              exit 1
              ;;
          esac
          ASSET_BASENAME="$(basename "$PREPARED_APK")"
          if [ "$ASSET_BASENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be exactly app-debug.apk, got $ASSET_BASENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK built by GitHub Actions.

          - Workflow Run Number: ${GITHUB_RUN_NUMBER}
          - Workflow Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for testing only (not a Play Store production release).
          - Signing: Signed only with a temporary debug keystore."

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions Artifact: app-debug-apk remains available as a backup."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** Normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "APK build succeeded. The GitHub Actions artifact 'app-debug-apk' remains available for download."
            fi
          fi
