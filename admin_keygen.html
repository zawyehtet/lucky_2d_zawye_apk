<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀 Offline Admin Key Generator</title>
  <style>
    :root {
      --emerald: #235347;
      --emerald-dark: #163832;
      --emerald-light: #8EB69B;
      --emerald-tint: #DAF1DE;
      --bg: #EFF5F2;
      --card: #FFFFFF;
      --text: #0B2B26;
      --muted: #5C7670;
      --danger: #D32F2F;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px 14px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(145deg, #163832 0%, #235347 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }
    .card-header {
      background: var(--emerald);
      color: #FFFFFF;
      padding: 22px 20px;
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 10px;
      background: rgba(255, 255, 255, 0.14);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .card-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }
    .card-header p {
      margin: 6px 0 0;
      font-size: 12.5px;
      opacity: 0.88;
    }
    .card-body {
      padding: 22px 20px 24px;
    }
    .field-group {
      margin-bottom: 16px;
    }
    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"],
    input[type="password"] {
      flex: 1;
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1.5px solid #C5D9D1;
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: #F9FCFA;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--emerald);
      background: #FFFFFF;
    }
    .btn-inline {
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-tint);
      border: 1px solid var(--emerald-light);
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-inline:hover {
      background: #C5E8CC;
    }
    .btn-generate {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
      background: var(--emerald);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 83, 71, 0.28);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-generate:hover {
      background: var(--emerald-dark);
    }
    .btn-generate:active {
      transform: scale(0.99);
    }
    .output-card {
      margin-top: 20px;
      padding: 16px;
      background: var(--emerald-tint);
      border: 1.5px dashed var(--emerald);
      border-radius: 12px;
      text-align: center;
    }
    .output-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--emerald-dark);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .output-key {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--emerald);
      word-break: break-all;
      user-select: all;
    }
    .btn-copy {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      color: var(--emerald);
      background: #FFFFFF;
      border: 1.5px solid var(--emerald);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:hover {
      background: #F1F9F3;
    }
    .status {
      margin-top: 10px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      min-height: 18px;
      color: var(--emerald);
    }
    .status.error {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">🍀</div>
      <h1>Admin Key Generator</h1>
      <p>100% Offline HMAC-SHA256 Activation Tool</p>
    </div>

    <div class="card-body">
      <!-- 1. Client Device ID -->
      <div class="field-group">
        <div class="field-label">
          <span>Client Device ID</span>
        </div>
        <div class="input-row">
          <input
            id="deviceIdInput"
            type="text"
            placeholder="e.g. 8F4A2C91E0B37D12"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase()"
          />
          <button type="button" class="btn-inline" onclick="pasteDeviceId()">
            Paste
          </button>
        </div>
      </div>

      <!-- 2. Secret Key -->
      <div class="field-group">
        <div class="field-label">
          <span>Shared Secret Key</span>
        </div>
        <div class="input-row">
          <input
            id="secretKeyInput"
            type="password"
            value="Lucky3D_Super_Secret_Key_2026!#"
            autocomplete="off"
          />
          <button type="button" class="btn-inline" id="toggleSecretBtn" onclick="toggleSecretVisibility()">
            Show
          </button>
        </div>
      </div>

      <!-- Generate Button -->
      <button type="button" class="btn-generate" onclick="generateLicenseKey()">
        🔑 Generate Activation Key (Key ထုတ်မည်)
      </button>

      <!-- Output Card -->
      <div class="output-card">
        <div class="output-title">Activation Key (XXXX-XXXX-XXXX)</div>
        <div id="licenseOutput" class="output-key">XXXX-XXXX-XXXX</div>
        <button type="button" class="btn-copy" onclick="copyLicenseKey()">
          📋 Copy Activation Key (Key ကူးယူမည်)
        </button>
      </div>

      <div id="statusMessage" class="status"></div>
    </div>
  </div>

  <script>
    function normalizeDeviceId(raw) {
      return (raw || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function setStatus(message, isError = false) {
      const el = document.getElementById("statusMessage");
      el.textContent = message;
      el.className = isError ? "status error" : "status";
    }

    async function pasteDeviceId() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById("deviceIdInput").value = normalizeDeviceId(text);
          setStatus("Device ID pasted from clipboard.");
          generateLicenseKey();
        } else {
          setStatus("Clipboard is empty.", true);
        }
      } catch (err) {
        setStatus("Please paste manually (Ctrl+V / Long-press).", true);
      }
    }

    function toggleSecretVisibility() {
      const secretInput = document.getElementById("secretKeyInput");
      const btn = document.getElementById("toggleSecretBtn");
      if (secretInput.type === "password") {
        secretInput.type = "text";
        btn.textContent = "Hide";
      } else {
        secretInput.type = "password";
        btn.textContent = "Show";
      }
    }

    async function generateLicenseKey() {
      const deviceInputEl = document.getElementById("deviceIdInput");
      const secretInputEl = document.getElementById("secretKeyInput");
      const outputEl = document.getElementById("licenseOutput");

      const deviceId = normalizeDeviceId(deviceInputEl.value);
      deviceInputEl.value = deviceId;
      const secret = secretInputEl.value;

      if (!deviceId) {
        outputEl.textContent = "XXXX-XXXX-XXXX";
        setStatus("Please enter a valid Client Device ID.", true);
        return;
      }

      if (!secret) {
        outputEl.textContent = "XXXX-XXXX-XXXX";
        setStatus("Shared Secret Key cannot be empty.", true);
        return;
      }

      const encoder = new TextEncoder();
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(secret),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );

      const signature = await crypto.subtle.sign(
        "HMAC",
        cryptoKey,
        encoder.encode(deviceId)
      );

      const hexDigest = Array.from(new Uint8Array(signature))
        .map(b => b.toString(16).padStart(2, "0").toUpperCase())
        .join("");

      const raw12 = hexDigest.substring(0, 12);
      const formatted = `${raw12.slice(0, 4)}-${raw12.slice(4, 8)}-${raw12.slice(8, 12)}`;
      outputEl.textContent = formatted;
      setStatus("Activation Key generated successfully!");
    }

    async function copyLicenseKey() {
      const key = document.getElementById("licenseOutput").textContent;
      if (!key || key === "XXXX-XXXX-XXXX") {
        setStatus("Please generate an Activation Key first.", true);
        return;
      }
      try {
        await navigator.clipboard.writeText(key);
        setStatus(`Copied to clipboard: ${key}`);
      } catch (err) {
        setStatus("Failed to copy automatically. Select and copy manually.", true);
      }
    }
  </script>
</body>
</html>
